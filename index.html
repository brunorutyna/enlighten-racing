<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enlighten Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1120; --surface:#0e1626; --panel:#111b2e; --panel2:#172441; --line:#253355;
  --text:#e9edf6; --muted:#8ea0c2; --faint:#5d6d8f;
  --good:#3ccf8e; --bad:#ff6b6b; --warn:#f2b84b; --ref:#8ea0c2;
  --r:12px;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body)}
a{color:#7fb2ff}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font:700 34px/1.1 var(--display);margin:0;letter-spacing:-.5px}
h1 small{display:block;font:500 13px var(--body);color:var(--muted);letter-spacing:.3px;margin-top:6px}
h2{font:600 18px var(--display);margin:0 0 12px}
.stamp{font:12px var(--mono);color:var(--muted);text-align:right}
.stale{display:none;margin:0 0 18px;padding:10px 14px;border:1px solid #6b4a12;background:#2a1f0b;border-radius:var(--r);color:var(--warn);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.tile .v{font:600 24px var(--mono);margin-top:4px}
.tile .s{font:12px var(--mono);color:var(--muted)}
.tile .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px var(--body);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid #1b2742;text-align:right;font-family:var(--mono);white-space:nowrap}
tr:last-child td{border-bottom:0}
.name{font:600 14px var(--body);display:flex;align-items:center;gap:9px}
.key{width:14px;height:3px;border-radius:2px;flex:none}
.pos{color:var(--good)} .neg{color:var(--bad)} .mut{color:var(--muted)}
.chip{font:500 11px var(--body);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px var(--mono);min-width:150px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
.tip .d{color:var(--muted);margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .row b{font-weight:600}
.tip .row span{display:flex;align-items:center;gap:6px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.bot h3{font:600 16px var(--display);margin:0;display:flex;align-items:center;gap:10px}
.bot .meta{font-size:12px;color:var(--muted);margin:4px 0 12px}
.bot h4{font:500 11px var(--body);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:14px 0 4px}
.bot td,.bot th{padding:6px 5px;font-size:12px}
.note{font-size:13px;color:var(--text);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:4px 0}
.note i{color:var(--muted);font-style:normal;font-family:var(--mono);font-size:12px;margin-right:6px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.pre{text-align:center;padding:36px 18px}
.pre .big{font:700 28px var(--display)}
.scroll{overflow-x:auto}
footer{color:var(--faint);font-size:12px;margin-top:28px;line-height:1.7}
button.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font:12px var(--body);cursor:pointer}
button.tab[aria-pressed=true]{color:var(--text);background:var(--panel2)}
button.tab:focus-visible{outline:2px solid #7fb2ff;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Enlighten Racing<small>Paper-trading bots racing with fake money: 20,000 DKK each · US &amp; Danish stocks · Saxo-like costs</small></h1>
    <div class="stamp" id="stamp">loading…</div>
  </header>
  <div class="stale" id="stale" role="status"></div>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip"></div>
<script>
"use strict";
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const NS = "http://www.w3.org/2000/svg";
const S = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const dkk = v => v == null ? "–" : v.toLocaleString("da-DK", {maximumFractionDigits: 0}) + " kr";
const pct = (v, d = 2) => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(d) + "%";
const pp = v => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(2) + " pp";
const cls = v => v == null ? "mut" : v > 0 ? "pos" : v < 0 ? "neg" : "mut";
const REF = {SPY: "#8ea0c2", "^OMXC25": "#5d6d8f"};

fetch("data/race.json", {cache: "no-store"}).then(r => r.json()).then(render).catch(err => {
  document.getElementById("stamp").textContent = "no data yet";
  const app = document.getElementById("app");
  const p = $("div", "panel pre"); p.append($("div", "big", "The race hasn't started yet"), $("p", "mut", "Results appear here after the first daily run."));
  app.append(p);
});

function render(d) {
  const app = document.getElementById("app");
  document.getElementById("stamp").textContent = `as of ${d.as_of} close · updated ${d.generated_at.replace("T", " ").slice(0, 16)} UTC`;
  const ageDays = (Date.now() - Date.parse(d.as_of + "T22:00:00Z")) / 864e5;
  const dow = new Date(d.as_of).getUTCDay();
  const racingNow = d.bots.some(b => b.equity && b.equity.length);
  if (racingNow && ageDays > (dow === 5 ? 4 : 2)) {
    const s = document.getElementById("stale");
    s.style.display = "block";
    s.textContent = `⚠ Stale: the last completed run was for ${d.as_of}. A daily run was missed, so the numbers below are not current.`;
  }
  const racing = d.bots.filter(b => b.equity && b.equity.length);
  if (!racing.length) { renderPre(app, d); footer(d); return; }

  // hero tiles: one per bot, ranked
  const ranked = [...racing].sort((a, b) => b.summary.return_pct - a.summary.return_pct);
  const hero = $("div", "hero");
  ranked.forEach((b, i) => {
    const t = $("div", "tile"); const bar = $("div", "bar"); bar.style.background = b.color; t.append(bar);
    t.append($("div", "k", `#${i + 1} ${b.name}`));
    const v = $("div", "v " + cls(b.summary.return_pct), pct(b.summary.return_pct)); t.append(v);
    t.append($("div", "s", `${dkk(b.summary.value)} · vs SPY ${pp(b.summary.vs_spy_pp)}`));
    hero.append(t);
  });
  app.append(hero);

  // race chart
  const rp = $("section", "panel"); rp.append($("h2", null, "The race: each bot indexed to 100 at its own start"));
  const series = racing.map(b => ({name: b.name, color: b.color, pts: indexSeries(b.equity, b.equity[0] ? d.start_cash_dkk : null)}));
  const startDate = racing.map(b => b.start).sort()[0];
  const bench = Object.entries(d.benchmarks || {}).map(([k, v]) => ({name: v.label, color: REF[k] || "#8ea0c2", dash: true,
    pts: indexBench(v.series, startDate)})).filter(s => s.pts.length);
  lineChart(rp, [...series, ...bench], {base: 100, fmt: v => v.toFixed(1)});
  app.append(rp);

  // drawdown chart
  const dp = $("section", "panel"); dp.append($("h2", null, "Drawdown: distance below each bot's own peak"));
  lineChart(dp, racing.map(b => ({name: b.name, color: b.color, pts: drawdown(b.equity, d.start_cash_dkk)})), {base: 0, fmt: v => v.toFixed(1) + "%", height: 200});
  app.append(dp);

  // leaderboard
  const lp = $("section", "panel"); lp.append($("h2", null, "Leaderboard"));
  const sc = $("div", "scroll"); const tb = $("table");
  const head = ["Bot", "Value", "Return", "vs SPY (DKK)", "vs C25", "Max drawdown", "Sharpe", "Win rate", "Trades", "Days"];
  const thr = $("tr"); head.forEach(h => thr.append($("th", null, h))); tb.append(thr);
  ranked.concat(d.bots.filter(b => !racing.includes(b))).forEach(b => {
    const s = b.summary || {}; const tr = $("tr");
    const n = $("td"); const nm = $("div", "name"); const k = $("span", "key"); k.style.background = b.color;
    nm.append(k, document.createTextNode(b.name), $("span", "chip", b.status === "racing" ? b.version : b.status)); n.append(nm); tr.append(n);
    [[dkk(s.value)], [pct(s.return_pct), cls(s.return_pct)], [pp(s.vs_spy_pp), cls(s.vs_spy_pp)], [pp(s.vs_c25_pp), cls(s.vs_c25_pp)],
     [s.max_dd_pct == null ? "–" : s.max_dd_pct.toFixed(1) + "%", s.max_dd_pct < 0 ? "neg" : "mut"],
     [s.sharpe == null ? "–" : s.sharpe.toFixed(2)], [s.win_rate_pct == null ? "–" : s.win_rate_pct.toFixed(0) + "%"],
     [s.trades ?? "–"], [s.days ?? "–"]].forEach(([v, c]) => tr.append($("td", c || null, String(v))));
    tb.append(tr);
  });
  sc.append(tb); lp.append(sc);
  lp.append($("p", "mut", "Sharpe is shown once a bot has 10+ days of history. Each bot is compared with SPY and C25 over its own dates, so bots that join later are scored fairly."));
  app.append(lp);

  // bot cards
  const g = $("div", "grid2");
  ranked.concat(d.bots.filter(b => !racing.includes(b))).forEach(b => g.append(botCard(b)));
  app.append(g);
  footer(d);
}

function renderPre(app, d) {
  const p = $("div", "panel pre");
  const starts = d.bots.map(b => b.start).filter(Boolean).sort();
  p.append($("div", "big", starts.length ? `Race starts ${starts[0]}` : "Race not started"));
  p.append($("p", "mut", "Each bot starts with 20,000 DKK of fake money. Results appear here after the first daily run."));
  app.append(p);
  const g = $("div", "grid2"); d.bots.forEach(b => g.append(botCard(b))); app.append(g);
}

function botCard(b) {
  const c = $("section", "panel bot");
  const h = $("h3"); const k = $("span", "key"); k.style.background = b.color; k.style.width = "18px"; k.style.height = "4px";
  h.append(k, document.createTextNode(b.name), $("span", "chip", b.kind)); c.append(h);
  c.append($("div", "meta", `${b.style} · ${b.version} · ${b.start ? (b.status === "waiting" ? "starts " : "started ") + b.start : "start date not set"}${b.status && b.status !== "racing" ? " · " + b.status : ""}`));
  if (b.summary) c.append($("div", "meta", `Cash ${dkk(b.cash_dkk)} · value ${dkk(b.summary.value)}`));
  c.append($("h4", null, "Holdings"));
  if (b.holdings && b.holdings.length) {
    const t = $("table"); const r = $("tr"); ["Symbol", "Qty", "Value", "P/L", "Since"].forEach(x => r.append($("th", null, x))); t.append(r);
    b.holdings.forEach(x => { const tr = $("tr");
      tr.append($("td", null, x.symbol), $("td", null, String(x.qty)), $("td", null, dkk(x.value_dkk)), $("td", cls(x.pnl_pct), pct(x.pnl_pct, 1)), $("td", "mut", x.since.slice(5)));
      t.append(tr); });
    c.append(t);
  } else c.append($("div", "empty", b.summary ? "All cash." : "—"));
  c.append($("h4", null, "Recent trades"));
  const tr = (b.trades || []).slice(-8).reverse();
  if (tr.length) {
    const t = $("table"); const r = $("tr"); ["Date", "Side", "Symbol", "Qty", "Price", "P/L"].forEach(x => r.append($("th", null, x))); t.append(r);
    tr.forEach(x => { const row = $("tr");
      row.append($("td", "mut", x.date.slice(5)), $("td", x.side === "buy" ? "pos" : "neg", x.side === "buy" ? "BUY" : "SELL"), $("td", null, x.symbol), $("td", null, String(x.qty)),
        $("td", null, (x.ccy === "USD" ? "$" : "") + x.price.toFixed(2) + (x.ccy === "DKK" ? " kr" : "")), $("td", cls(x.pnl_dkk), x.pnl_dkk == null ? "" : dkk(x.pnl_dkk)));
      t.append(row); });
    const s = $("div", "scroll"); s.append(t); c.append(s);
  } else c.append($("div", "empty", "No trades yet."));
  if (b.notes && b.notes.length) {
    c.append($("h4", null, "Agent log"));
    b.notes.slice(-3).reverse().forEach(n => { const p = $("div", "note"); p.append($("i", null, n.date), document.createTextNode(n.text)); c.append(p); });
  }
  return c;
}

function indexSeries(eq, start) {
  return eq.map(e => ({x: e.date, y: e.value / start * 100}));
}
function indexBench(series, startDate) {
  const before = series.filter(p => p.date < startDate); const base = (before.length ? before[before.length - 1] : series[0]);
  if (!base) return [];
  return series.filter(p => p.date >= startDate).map(p => ({x: p.date, y: p.value / base.value * 100}));
}
function drawdown(eq, start) {
  let peak = start; return eq.map(e => { peak = Math.max(peak, e.value); return {x: e.date, y: (e.value / peak - 1) * 100}; });
}

function lineChart(host, series, opt) {
  const W = 1100, H = opt.height || 340, m = {l: 48, r: 118, t: 10, b: 26};
  const legend = $("div", "legend");
  series.forEach(s => { const sp = $("span"); const k = S("svg", {width: 18, height: 6});
    k.append(S("line", {x1: 0, x2: 18, y1: 3, y2: 3, stroke: s.color, "stroke-width": 2, "stroke-dasharray": s.dash ? "4 3" : ""}));
    sp.append(k, document.createTextNode(s.name)); legend.append(sp); });
  host.append(legend);
  const xs = [...new Set(series.flatMap(s => s.pts.map(p => p.x)))].sort();
  if (xs.length < 1) { host.append($("div", "empty", "Not enough data yet.")); return; }
  const ys = series.flatMap(s => s.pts.map(p => p.y)).concat([opt.base]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad;
  const X = i => m.l + (xs.length === 1 ? 0 : i / (xs.length - 1)) * (W - m.l - m.r);
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const xi = Object.fromEntries(xs.map((x, i) => [x, i]));
  const svg = S("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": host.querySelector("h2")?.textContent || "chart"});
  // grid + y ticks
  const step = niceStep((hi - lo) / 5);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    svg.append(S("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "#1b2742", "stroke-width": 1}));
    const t = S("text", {x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", fill: "#8ea0c2", "font-size": 11, "font-family": "JetBrains Mono, ui-monospace, monospace"}); t.textContent = opt.fmt(v); svg.append(t);
  }
  svg.append(S("line", {x1: m.l, x2: W - m.r, y1: Y(opt.base), y2: Y(opt.base), stroke: "#3a4a6e", "stroke-width": 1}));
  // x labels: first, middle, last
  [0, Math.floor((xs.length - 1) / 2), xs.length - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(i => {
    const t = S("text", {x: X(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === xs.length - 1 ? "end" : "middle", fill: "#8ea0c2", "font-size": 11, "font-family": "JetBrains Mono, ui-monospace, monospace"});
    t.textContent = xs[i]; svg.append(t);
  });
  // lines (benchmarks first so bots draw on top)
  const ends = [];
  [...series].sort((a, b) => (b.dash ? 1 : 0) - (a.dash ? 1 : 0)).forEach(s => {
    if (!s.pts.length) return;
    const dpath = s.pts.map((p, i) => (i ? "L" : "M") + X(xi[p.x]).toFixed(1) + "," + Y(p.y).toFixed(1)).join("");
    svg.append(S("path", {d: dpath, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": s.dash ? "5 4" : ""}));
    const last = s.pts[s.pts.length - 1];
    if (!s.dash) svg.append(S("circle", {cx: X(xi[last.x]), cy: Y(last.y), r: 4, fill: s.color, stroke: "#111b2e", "stroke-width": 2}));
    ends.push({s, y: Y(last.y), v: last.y});
  });
  // direct end labels, de-collided
  ends.sort((a, b) => a.y - b.y); let prev = -1e9;
  ends.forEach(e => { e.ly = Math.max(e.y, prev + 14); prev = e.ly; });
  ends.forEach(e => { const t = S("text", {x: W - m.r + 8, y: e.ly + 4, fill: "#c3cbe0", "font-size": 11, "font-family": "Inter, system-ui, sans-serif"});
    t.textContent = `${e.s.name.length > 13 ? e.s.name.slice(0, 12) + "…" : e.s.name} ${opt.fmt(e.v)}`; svg.append(t); });
  // crosshair
  const hair = S("line", {y1: m.t, y2: H - m.b, stroke: "#8ea0c2", "stroke-width": 1, opacity: 0});
  svg.append(hair);
  const hit = S("rect", {x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent", tabindex: 0});
  svg.append(hit);
  const box = $("div", "chartbox"); box.append(svg); host.append(box);
  const tip = document.getElementById("tip");
  const show = i => {
    hair.setAttribute("x1", X(i)); hair.setAttribute("x2", X(i)); hair.setAttribute("opacity", .6);
    tip.replaceChildren($("div", "d", xs[i]));
    series.map(s => ({s, p: s.pts.find(p => p.x === xs[i])})).filter(r => r.p).sort((a, b) => b.p.y - a.p.y).forEach(({s, p}) => {
      const row = $("div", "row"); const lab = $("span"); const k = S("svg", {width: 12, height: 4});
      k.append(S("line", {x1: 0, x2: 12, y1: 2, y2: 2, stroke: s.color, "stroke-width": 2, "stroke-dasharray": s.dash ? "3 2" : ""}));
      lab.append(k, document.createTextNode(s.name)); row.append($("b", null, opt.fmt(p.y)), lab); tip.append(row);
    });
    tip.style.display = "block";
    const r = svg.getBoundingClientRect(); const px = r.left + X(i) / W * r.width + window.scrollX;
    tip.style.left = Math.min(px + 14, window.scrollX + innerWidth - 220) + "px"; tip.style.top = (r.top + window.scrollY + 20) + "px";
  };
  let cur = xs.length - 1;
  hit.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W;
    cur = Math.max(0, Math.min(xs.length - 1, Math.round((x - m.l) / (W - m.l - m.r) * (xs.length - 1)))); show(cur); });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; hair.setAttribute("opacity", 0); });
  hit.addEventListener("focus", () => show(cur));
  hit.addEventListener("blur", () => { tip.style.display = "none"; hair.setAttribute("opacity", 0); });
  hit.addEventListener("keydown", ev => { if (ev.key === "ArrowLeft") cur = Math.max(0, cur - 1); else if (ev.key === "ArrowRight") cur = Math.min(xs.length - 1, cur + 1); else return; ev.preventDefault(); show(cur); });
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

function footer(d) {
  const f = document.getElementById("foot"); const c = d.costs || {};
  f.replaceChildren();
  [`Rules for every bot: long only, whole shares, no leverage. Orders are decided after the close and filled at the next session's open with ${c.slippage_bps ?? 5} bps slippage. Costs: ${c.commission_pct ?? 0.08}% commission (min 1 USD on US stocks, 10 DKK on Danish stocks) and ${c.fx_fee_pct ?? 0.25}% FX on USD trades. Daily-loss kill switch at −10%. Pre-tax.`,
   "Fake money only. This page shows results, holdings and trades; the bots' strategies and code are private. Nothing here is investment advice."]
   .forEach(t => f.append($("div", null, t)));
}
</script>
</body>
</html>
